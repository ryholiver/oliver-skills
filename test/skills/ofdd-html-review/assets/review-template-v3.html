<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>OFDD Review · 应用层模板</title>
  <style>
    /* =========================================================
       视觉方向：决策档案 / 编辑部审阅稿
       目标：突出问题、判断、方向和决定，同时让证据链按需展开。
       ========================================================= */
    :root {
      --paper: #f4f0e7;
      --paper-deep: #e9e2d5;
      --ink: #17201f;
      --ink-soft: #59615d;
      --line: rgba(23, 32, 31, 0.17);
      --line-strong: rgba(23, 32, 31, 0.42);
      --card: rgba(255, 253, 248, 0.78);
      --navy: #173a46;
      --navy-soft: #dce8e8;
      --red: #c3412f;
      --red-soft: #f4d9d2;
      --amber: #a96d16;
      --amber-soft: #f3e5c8;
      --green: #38664f;
      --green-soft: #dbe8df;
      --shadow: 0 24px 70px rgba(35, 43, 40, 0.10);
      --radius: 22px;
      --serif: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 92px;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 2%, rgba(195, 65, 47, 0.10), transparent 24rem),
        linear-gradient(rgba(23, 32, 31, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 32, 31, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 32px 32px, 32px 32px, auto;
      font-family: var(--sans);
      line-height: 1.72;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(195, 65, 47, 0.35);
      outline-offset: 4px;
    }

    /* 顶部操作栏保持轻量，只承载审计、折叠和打印。 */
    .topbar {
      position: sticky;
      z-index: 50;
      top: 0;
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px clamp(18px, 4vw, 58px);
      border-bottom: 1px solid var(--line);
      background: rgba(244, 240, 231, 0.88);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--paper);
      background: var(--ink);
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .tool-button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 253, 248, 0.72);
      font: 600 12px/1 var(--sans);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .tool-button:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: #fffdf8;
    }

    .tool-button[aria-pressed="true"] {
      color: #fff;
      border-color: var(--navy);
      background: var(--navy);
    }

    /* 页面采用窄侧栏加宽内容区，像一份可导航的决策卷宗。 */
    .page-shell {
      display: grid;
      grid-template-columns: minmax(150px, 210px) minmax(0, 1040px);
      justify-content: center;
      gap: clamp(28px, 5vw, 72px);
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 30px clamp(18px, 4vw, 58px) 72px;
    }

    .section-nav {
      position: sticky;
      top: 105px;
      align-self: start;
      padding-top: 12px;
    }

    .section-nav::before {
      display: block;
      width: 42px;
      height: 5px;
      margin-bottom: 24px;
      background: var(--red);
      content: "";
    }

    .section-nav-title {
      margin: 0 0 14px;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .section-nav a {
      display: block;
      margin-left: -10px;
      padding: 8px 10px;
      border-left: 2px solid transparent;
      color: var(--ink-soft);
      font-size: 12px;
      text-decoration: none;
      transition: color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .section-nav a:hover,
    .section-nav a.is-active {
      color: var(--ink);
      border-color: var(--red);
      transform: translateX(4px);
    }

    main {
      min-width: 0;
    }

    /* 首屏将“要决定什么”作为最强信息，而非先陈列资料。 */
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 260px;
      padding: clamp(24px, 4vw, 46px);
      border: 1px solid var(--line-strong);
      border-radius: 2px 2px var(--radius) var(--radius);
      color: #f8f5ed;
      background: var(--navy);
      box-shadow: var(--shadow);
      animation: reveal-up 650ms both;
    }

    .hero::after {
      position: absolute;
      right: -95px;
      bottom: -175px;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      box-shadow:
        0 0 0 45px rgba(255, 255, 255, 0.035),
        0 0 0 90px rgba(255, 255, 255, 0.025);
      content: "";
    }

    .hero-kicker {
      display: flex;
      position: relative;
      z-index: 1;
      align-items: center;
      gap: 10px;
      margin: 0 0 54px;
      color: rgba(248, 245, 237, 0.68);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      width: 42px;
      height: 2px;
      background: var(--red);
      content: "";
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      max-width: 850px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(29px, 4.4vw, 52px);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 1.12;
    }

    /* 副标题独立于主标题，用小一号字呈现 Review 摘要，避免首屏被长文本撑爆。 */
    .hero-subtitle {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 14px 0 0;
      color: rgba(248, 245, 237, 0.78);
      font-family: var(--serif);
      font-size: clamp(16px, 1.8vw, 21px);
      line-height: 1.55;
    }

    .hero-question {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 18px 0 0;
      color: rgba(248, 245, 237, 0.84);
      font-family: var(--serif);
      font-size: clamp(16px, 1.7vw, 20px);
      line-height: 1.55;
    }

    .hero-meta {
      display: flex;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 22px;
      color: rgba(248, 245, 237, 0.68);
      font-size: 11px;
    }

    .hero-meta strong {
      color: #fff;
      font-weight: 600;
    }

    .review-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .review-status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e5b862;
      box-shadow: 0 0 0 5px rgba(229, 184, 98, 0.14);
      content: "";
    }

    /* 生命周期提示必须在首屏可见，避免用户把续轮误认为第一次 Review。 */
    .lifecycle-banner {
      display: grid;
      gap: 10px;
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin-top: 28px;
      padding: 16px 18px;
      border: 1px solid rgba(248, 245, 237, 0.24);
      border-radius: 12px;
      background: rgba(248, 245, 237, 0.08);
      color: rgba(248, 245, 237, 0.86);
    }

    .lifecycle-banner.is-potential {
      border-color: rgba(229, 184, 98, 0.58);
      background: rgba(229, 184, 98, 0.12);
    }

    .lifecycle-banner.is-blocking {
      border-color: rgba(219, 105, 86, 0.74);
      background: rgba(219, 105, 86, 0.16);
    }

    .lifecycle-banner-title {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .lifecycle-banner-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: rgba(248, 245, 237, 0.72);
      font-size: 11px;
      line-height: 1.5;
    }

    /* 摘要区域故意打破等宽栅格，让“建议”比普通元信息更突出。 */
    .summary-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 18px;
      margin-top: 20px;
    }

    .summary-card {
      min-height: 150px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 14px 40px rgba(35, 43, 40, 0.06);
      animation: reveal-up 650ms 90ms both;
    }

    .summary-card.is-accent {
      color: #fffaf3;
      border-color: var(--red);
      background: var(--red);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .is-accent .eyebrow {
      color: rgba(255, 250, 243, 0.72);
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .summary-main {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.38;
    }

    /* 长摘要默认折叠为几行，点击“展开全文”后显示完整内容。 */
    .summary-collapse {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
    }

    .summary-collapse.is-open {
      display: block;
      overflow: visible;
    }

    .expand-toggle {
      display: inline-block;
      margin-top: 10px;
      padding: 0;
      border: 0;
      color: var(--red);
      background: transparent;
      cursor: pointer;
      font: 700 11px/1 var(--sans);
      letter-spacing: 0.08em;
    }

    .is-accent .expand-toggle {
      color: rgba(255, 250, 243, 0.86);
    }

    .summary-note {
      margin: 12px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .is-accent .summary-note {
      color: rgba(255, 250, 243, 0.76);
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      overflow: hidden;
      margin: 18px 0 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--line);
      animation: reveal-up 650ms 150ms both;
    }

    .metric {
      padding: 13px 18px;
      background: rgba(255, 253, 248, 0.88);
    }

    .metric-value {
      display: block;
      margin-bottom: 2px;
      font-family: var(--serif);
      font-size: 21px;
    }

    .metric-label {
      color: var(--ink-soft);
      font-size: 10px;
    }

    .review-section {
      margin-top: 54px;
      scroll-margin-top: 90px;
      animation: reveal-up 650ms both;
    }

    .section-heading {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line-strong);
    }

    .section-number {
      color: var(--red);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .section-heading h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(24px, 3.2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .section-heading p {
      max-width: 680px;
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    /* 推理链使用纵向轨道，强调判断可以一路回溯到证据。 */
    .reasoning-list {
      display: grid;
      gap: 18px;
    }

    .reasoning-card {
      position: relative;
      padding: 0 0 0 50px;
    }

    .reasoning-card::before {
      position: absolute;
      top: 36px;
      bottom: -24px;
      left: 19px;
      width: 1px;
      background: var(--line-strong);
      content: "";
    }

    .reasoning-card:last-child::before {
      display: none;
    }

    .reasoning-node {
      display: grid;
      position: absolute;
      top: 14px;
      left: 0;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 700;
    }

    .reasoning-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }

    .reasoning-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 20px 14px;
    }

    .reasoning-top h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.3;
    }

    .machine-id {
      display: none;
      color: var(--ink-soft);
      font: 700 10px/1 var(--sans);
      letter-spacing: 0.09em;
    }

    body.audit-mode .machine-id {
      display: inline-flex;
    }

    .status-chip {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pending {
      color: #7b4e0c;
      background: var(--amber-soft);
    }

    .status-supported,
    .status-selected,
    .status-decided {
      color: #254b39;
      background: var(--green-soft);
    }

    .status-blocked {
      color: #932d20;
      background: var(--red-soft);
    }

    .status-neutral {
      color: #274b58;
      background: var(--navy-soft);
    }

    .reasoning-body {
      display: grid;
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .reasoning-layer {
      padding: 13px 20px;
      background: rgba(255, 253, 248, 0.76);
    }

    .layer-label {
      margin: 0 0 7px;
      color: var(--red);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .reasoning-layer p {
      margin: 0;
    }

    .criteria-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .criteria-tag {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.48);
      font-size: 10px;
    }

    .observation-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    /* 观察与证据默认折叠为一行摘要，展开后才是完整列表；保持 Judgment → Evidence 追溯链路。 */
    .observation-details {
      margin: 0;
      border-top: 1px solid var(--line);
    }

    .observation-details summary {
      padding: 12px 20px;
      cursor: pointer;
      color: var(--red);
      background: rgba(255, 253, 248, 0.76);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      user-select: none;
    }

    .observation-details[open] summary {
      border-bottom: 1px solid var(--line);
    }

    .observation-details .observation-list {
      padding: 0 20px 14px;
      background: rgba(255, 253, 248, 0.76);
    }

    .observation-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-left: 3px solid var(--navy);
      background: rgba(220, 232, 232, 0.42);
    }

    .observation-text {
      font-size: 12.5px;
      line-height: 1.6;
    }

    .evidence-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--navy);
      background: rgba(255, 255, 255, 0.62);
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .evidence-link::after {
      font-size: 11px;
      content: "↗";
    }

    .evidence-link:hover {
      transform: translateY(-1px);
      border-color: var(--navy);
    }

    /* 问题卡片以阻塞程度区分视觉强度。 */
    .question-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .question-card {
      display: flex;
      min-height: 250px;
      flex-direction: column;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }

    .question-card.is-blocking {
      border-top: 5px solid var(--red);
    }

    .question-card.is-later {
      border-top: 5px solid var(--amber);
    }

    .question-index {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .question-card h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.38;
    }

    .question-detail {
      display: grid;
      gap: 6px;
      margin-top: auto;
      padding-top: 14px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 10px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      line-height: 1.55;
    }

    .detail-row dt {
      color: var(--ink-soft);
    }

    .detail-row dd {
      margin: 0;
    }

    /* 方向卡片支持真正比较，而不是只展示推荐答案。 */
    .direction-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .direction-card {
      display: flex;
      position: relative;
      overflow: hidden;
      min-height: 350px;
      flex-direction: column;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.78);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .direction-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 50px rgba(35, 43, 40, 0.10);
    }

    .direction-card.is-recommended {
      color: #f9f5eb;
      border-color: var(--navy);
      background: var(--navy);
    }

    .direction-card.is-recommended::after {
      position: absolute;
      top: -65px;
      right: -65px;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      content: "";
    }

    .direction-letter {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      margin-bottom: 16px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 15px;
    }

    .direction-card h3 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.28;
    }

    .direction-goal {
      display: -webkit-box;
      overflow: hidden;
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 11.5px;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .is-recommended .direction-goal,
    .is-recommended .direction-list,
    .is-recommended .direction-detail summary {
      color: rgba(249, 245, 235, 0.72);
    }

    .direction-list {
      display: grid;
      gap: 6px;
      margin: 14px 0 0;
      padding: 0;
      color: var(--ink-soft);
      font-size: 11.5px;
      line-height: 1.5;
      list-style: none;
    }

    .direction-list li {
      position: relative;
      display: -webkit-box;
      overflow: hidden;
      padding-left: 14px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .direction-list li::before {
      position: absolute;
      top: 0.72em;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--red);
      content: "";
    }

    .direction-detail {
      margin-top: auto;
      padding-top: 12px;
    }

    .direction-detail summary {
      cursor: pointer;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
    }

    .direction-detail p {
      margin: 10px 0 0;
      font-size: 11.5px;
      line-height: 1.55;
    }

    .recommendation {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(240px, 0.55fr);
      gap: 1px;
      overflow: hidden;
      margin-top: 18px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--line-strong);
    }

    .recommendation-main,
    .recommendation-conditions {
      padding: 28px;
      background: rgba(255, 253, 248, 0.88);
    }

    .recommendation-main h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 30px;
    }

    .recommendation-main p,
    .recommendation-conditions p {
      margin: 12px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .decision-panel {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 3.5vw, 38px);
      border-radius: var(--radius);
      color: #fffaf2;
      background: var(--red);
      box-shadow: var(--shadow);
    }

    .decision-panel::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 170px;
      height: 100%;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      background: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.03) 0,
        rgba(255, 255, 255, 0.03) 8px,
        transparent 8px,
        transparent 16px
      );
      content: "";
    }

    .decision-panel h3 {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 10px 0 0;
      font-family: var(--serif);
      font-size: clamp(24px, 3.4vw, 40px);
      line-height: 1.2;
    }

    .decision-panel .eyebrow {
      color: rgba(255, 250, 242, 0.72);
    }

    .decision-meta {
      display: grid;
      position: relative;
      z-index: 1;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .decision-meta-item {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.32);
    }

    .decision-meta-item span {
      display: block;
      margin-bottom: 5px;
      color: rgba(255, 250, 242, 0.66);
      font-size: 10px;
    }

    .decision-meta-item strong {
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.5;
    }

    .table-shell {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--ink-soft);
      background: rgba(233, 226, 213, 0.58);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .writeback-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .writeback-item {
      min-height: 104px;
      padding: 16px;
      border: 1px dashed var(--line-strong);
      border-radius: 16px;
      background: rgba(255, 253, 248, 0.55);
    }

    .writeback-item.is-complete {
      border-style: solid;
      border-color: rgba(56, 102, 79, 0.42);
      background: var(--green-soft);
    }

    .writeback-item h3 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 16px;
    }

    .writeback-item p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 10.5px;
      line-height: 1.5;
    }

    .review-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid var(--line-strong);
      color: var(--ink-soft);
      font-size: 11px;
    }

    .review-footer strong {
      display: block;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 18px;
    }

    /* ============ v3 模块 + 条目式 ============ */
    .module {
      margin-top: 54px;
      scroll-margin-top: 90px;
      animation: reveal-up 650ms both;
    }

    .module-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line-strong);
    }

    .module-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(24px, 3.2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .module-head .section-number {
      font-size: clamp(24px, 3.2vw, 38px);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.12;
      padding-bottom: 0;
      border-bottom: 2px solid var(--red);
    }

    .module-head p {
      max-width: 680px;
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .declaration-list {
      display: grid;
      gap: 0;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      overflow: hidden;
    }

    .declaration-row {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 18px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
    }

    .declaration-row:last-child {
      border-bottom: 0;
    }

    .declaration-row dt {
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .declaration-row dd {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.65;
    }

    .entry-list {
      display: grid;
      gap: 12px;
    }

    .entry {
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--navy);
      border-radius: 14px;
      background: var(--card);
    }

    .entry.is-confirmed {
      border-left-color: var(--green);
    }

    .entry.is-partial {
      border-left-color: var(--amber);
    }

    .entry.is-pending {
      border-left-color: var(--red);
    }

    .entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .entry-id {
      color: var(--ink-soft);
      font: 700 11px/1 var(--sans);
      letter-spacing: 0.12em;
    }

    .entry-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 11px;
    }

    .meta-label {
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .based-observations {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .based-obs {
      display: block;
      padding: 8px 10px;
      border-left: 3px solid var(--navy);
      border-radius: 8px;
      background: rgba(220, 232, 232, 0.32);
      color: var(--ink-soft);
      font-size: 11.5px;
      line-height: 1.55;
      cursor: help;
    }

    .based-obs strong {
      margin-right: 8px;
      color: var(--navy);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .rel-link {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--navy);
      background: var(--navy-soft);
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
      cursor: help;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .rel-link:hover {
      border-color: var(--navy);
      transform: translateY(-1px);
    }

    .verification-checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .check-item {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 12px;
      line-height: 1.55;
    }

    .check-mark {
      flex: 0 0 auto;
      font-weight: 800;
    }

    .check-ok {
      color: var(--green);
    }

    .check-fail {
      color: var(--red);
    }

    .check-hint {
      margin-left: 6px;
      color: var(--ink-soft);
      font-size: 10px;
      font-style: normal;
      opacity: 0.65;
    }

    .direction-entry {
      border-left-color: var(--red);
    }

    .direction-entry .entry-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 18px;
    }

    .question-entry.is-blocking {
      border-left-color: var(--red);
    }

    .conclusion-panel {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--line-strong);
    }

    .conclusion-main,
    .conclusion-side {
      padding: 24px;
      background: rgba(255, 253, 248, 0.88);
    }

    .conclusion-main h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.4;
    }

    .conclusion-side p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    /* 关系悬浮卡片，与证据悬浮并列使用。 */
    .relation-tooltip {
      position: fixed;
      z-index: 99;
      width: min(340px, calc(100vw - 28px));
      padding: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--ink);
      background: #fffdf8;
      box-shadow: 0 18px 50px rgba(23, 32, 31, 0.16);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 130ms ease, transform 130ms ease;
    }

    .relation-tooltip.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .relation-tooltip strong {
      display: block;
      margin-bottom: 6px;
      color: var(--red);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .relation-tooltip p {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 证据悬浮卡片由脚本定位，避免被父容器裁切。 */
    .evidence-tooltip {
      position: fixed;
      z-index: 100;
      width: min(350px, calc(100vw - 28px));
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      color: var(--ink);
      background: #fffdf8;
      box-shadow: 0 22px 65px rgba(23, 32, 31, 0.2);
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 130ms ease, transform 130ms ease;
    }

    .evidence-tooltip.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .tooltip-label {
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .tooltip-quote {
      margin: 8px 0 0;
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.6;
    }

    .tooltip-meta {
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 10px;
    }

    @keyframes reveal-up {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 980px) {
      .page-shell {
        grid-template-columns: 1fr;
      }

      .section-nav {
        display: none;
      }

      .direction-grid,
      .writeback-grid {
        grid-template-columns: 1fr;
      }

      .direction-card {
        min-height: auto;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
      }

      .brand span:last-child {
        display: none;
      }

      .toolbar {
        gap: 5px;
      }

      .tool-button {
        padding: 0 10px;
      }

      .page-shell {
        padding-top: 20px;
      }

      .hero {
        min-height: 470px;
        border-radius: 0 0 22px 22px;
      }

      .hero-kicker {
        margin-bottom: 38px;
      }

      .summary-grid,
      .question-grid,
      .recommendation,
      .decision-meta {
        grid-template-columns: 1fr;
      }

      .metric-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .section-heading {
        grid-template-columns: 45px minmax(0, 1fr);
      }

      .reasoning-card {
        padding-left: 0;
      }

      .reasoning-node,
      .reasoning-card::before {
        display: none;
      }

      .reasoning-top,
      .observation-item {
        grid-template-columns: 1fr;
      }

      .reasoning-top {
        display: grid;
      }

      .observation-item {
        align-items: start;
      }
    }

    @media print {
      @page {
        margin: 14mm;
        size: A4;
      }

      body {
        color: #111;
        background: #fff;
      }

      .topbar,
      .section-nav,
      .evidence-tooltip {
        display: none !important;
      }

      .page-shell {
        display: block;
        width: 100%;
        padding: 0;
      }

      .hero,
      .decision-panel,
      .direction-card.is-recommended {
        color: #111;
        border: 2px solid #111;
        background: #fff;
        box-shadow: none;
      }

      .hero::after,
      .decision-panel::before {
        display: none;
      }

      .hero-meta,
      .hero-question,
      .direction-card.is-recommended .direction-goal,
      .direction-card.is-recommended .direction-list {
        color: #333;
      }

      .review-section,
      .reasoning-card,
      .question-card,
      .direction-card,
      .decision-panel {
        break-inside: avoid;
      }

      .machine-id {
        display: inline-flex;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部工具栏：不承载业务信息，只提供阅读和审计操作。 -->
  <header class="topbar">
    <div class="brand" aria-label="OFDD Review">
      <span class="brand-mark">OD</span>
      <span>OFDD / Review Application Layer</span>
    </div>
    <div class="toolbar" aria-label="页面工具">
      <button class="tool-button" id="audit-toggle" type="button" aria-pressed="false">显示 ID</button>
      <button class="tool-button" id="expand-toggle" type="button" aria-pressed="false">展开方向</button>
      <button class="tool-button" id="print-button" type="button">打印 / PDF</button>
    </div>
  </header>

  <div class="page-shell">
    <!-- 左侧导航由脚本依据固定章节生成高亮。 -->
    <aside class="section-nav" aria-label="Review 章节导航">
      <p class="section-nav-title">Review Index</p>
      <nav id="section-navigation"></nav>
    </aside>

    <!-- 主内容全部由 REVIEW_DATA 渲染，避免在 HTML 结构中重复维护业务事实。 -->
    <main id="review-app" aria-live="polite"></main>
  </div>

  <!-- 悬浮证据预览只显示短原文快照，完整上下文仍通过链接打开。 -->
  <aside class="evidence-tooltip" id="evidence-tooltip" role="tooltip" aria-hidden="true">
    <div class="tooltip-label" id="tooltip-label"></div>
    <blockquote class="tooltip-quote" id="tooltip-quote"></blockquote>
    <div class="tooltip-meta" id="tooltip-meta"></div>
  </aside>
  <aside class="relation-tooltip" id="relation-tooltip" role="tooltip" aria-hidden="true">
    <strong></strong>
    <p></p>
  </aside>

};
    /* REVIEW_DATA_END */

    /* 状态样式映射保持集中，便于未来扩展 OFDD 状态。 */
    const STATUS_CLASS = {
      pending: "status-pending",
      supported: "status-supported",
      selected: "status-selected",
      decided: "status-decided",
      blocked: "status-blocked",
      neutral: "status-neutral"
    };

    /* 对动态内容进行最小转义，避免来源文本破坏 HTML 结构。 */
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* 将数组渲染为标签，主要用于评价标准。 */
    function renderTags(items) {
      return items.map((item) => `<span class="criteria-tag">${escapeHtml(item)}</span>`).join("");
    }

    /* 证据链接保留机器 ID、短原文、定位和完整性，供悬浮与审计模式使用。 */
    function renderEvidence(observation) {
      const evidence = observation.evidence;
      return `
        <li class="observation-item">
          <div class="observation-text">
            <span class="machine-id">${escapeHtml(observation.id)}</span>
            ${escapeHtml(observation.text)}
          </div>
          <a
            class="evidence-link"
            href="${escapeHtml(evidence.href)}"
            data-evidence-label="${escapeHtml(evidence.label)}"
            data-evidence-quote="${escapeHtml(evidence.quote)}"
            data-evidence-meta="${escapeHtml(`${evidence.id} · ${evidence.locator} · ${evidence.integrity}`)}"
          >
            <span class="machine-id">${escapeHtml(evidence.id)}</span>
            ${escapeHtml(evidence.label)}
          </a>
        </li>
      `;
    }

    /* 单条认知链按“判断 → 推断 → 观察 → 证据”展开。 */
    function renderReasoningChain(chain, index) {
      return `
        <article class="reasoning-card" data-ofdd-chain="${escapeHtml(chain.id)}">
          <span class="reasoning-node">${String(index + 1).padStart(2, "0")}</span>
          <div class="reasoning-panel">
            <div class="reasoning-top">
              <div>
                <span class="machine-id">${escapeHtml(chain.id)}</span>
                <h3>${escapeHtml(chain.title)}</h3>
              </div>
              <span class="status-chip ${STATUS_CLASS[chain.statusTone] || STATUS_CLASS.neutral}">${escapeHtml(chain.status)}</span>
            </div>
            <div class="reasoning-body">
              <section class="reasoning-layer">
                <p class="layer-label">Judgment · 判断 <span class="machine-id">${escapeHtml(chain.judgment.id)}</span></p>
                <p>${escapeHtml(chain.judgment.text)}</p>
                <div class="criteria-list">${renderTags(chain.judgment.criteria)}</div>
              </section>
              <section class="reasoning-layer">
                <p class="layer-label">Inference · 推断 <span class="machine-id">${escapeHtml(chain.inference.id)}</span></p>
                <p>${escapeHtml(chain.inference.text)}</p>
              </section>
              <details class="observation-details">
                <summary>Observation & Evidence · 观察与证据（${chain.observations.length} 条）</summary>
                <ul class="observation-list">${chain.observations.map(renderEvidence).join("")}</ul>
              </details>
            </div>
          </div>
        </article>
      `;
    }

    /* 问题卡片将认知缺口和阻塞对象放在同一视图中。 */
    function renderQuestion(question) {
      const cardClass = question.tone === "blocking" ? "is-blocking" : "is-later";
      const chipClass = question.tone === "blocking" ? STATUS_CLASS.blocked : STATUS_CLASS.pending;
      const chipText = question.tone === "blocking" ? "阻塞项" : "后续验证";
      return `
        <article class="question-card ${cardClass}" data-ofdd-id="${escapeHtml(question.id)}">
          <div class="question-index">
            <span class="machine-id">${escapeHtml(question.id)}</span>
            <span class="status-chip ${chipClass}">${chipText}</span>
          </div>
          <h3>${escapeHtml(question.text)}</h3>
          <dl class="question-detail">
            <div class="detail-row"><dt>提问目的</dt><dd>${escapeHtml(question.purpose)}</dd></div>
            <div class="detail-row"><dt>影响对象</dt><dd>${escapeHtml(question.impact)}</dd></div>
            <div class="detail-row"><dt>阻塞性</dt><dd>${escapeHtml(question.blocking)}</dd></div>
            <div class="detail-row"><dt>需要证据</dt><dd>${escapeHtml(question.evidenceNeeded)}</dd></div>
            <div class="detail-row"><dt>回答人</dt><dd>${escapeHtml(question.owner)}</dd></div>
          </dl>
        </article>
      `;
    }

    /* 方向卡片同时展示优势、风险和边界，推荐项仅增强视觉，不隐藏其他选项。 */
    function renderDirection(direction) {
      return `
        <article class="direction-card ${direction.selected ? "is-recommended" : ""}" data-ofdd-id="${escapeHtml(direction.id)}">
          <span class="direction-letter">${escapeHtml(direction.letter)}</span>
          <span class="machine-id">${escapeHtml(direction.id)}</span>
          <div class="direction-status-row">
            <span class="status-chip ${direction.selected ? STATUS_CLASS.selected : STATUS_CLASS.pending}">${escapeHtml(direction.selected ? "当前推荐/已选" : direction.status || "待确认")}</span>
            ${direction.reviewReady ? `<span class="status-chip ${STATUS_CLASS.supported}">可进入 Review</span>` : ""}
          </div>
          <h3>${escapeHtml(direction.title)}</h3>
          <p class="direction-goal">${escapeHtml(direction.goal)}</p>
          <ul class="direction-list">
            ${direction.benefits.map((benefit) => `<li>${escapeHtml(benefit)}</li>`).join("")}
          </ul>
          <details class="direction-detail">
            <summary>查看风险与边界</summary>
            <p><strong>风险：</strong>${escapeHtml(direction.risk)}</p>
            <p><strong>边界：</strong>${escapeHtml(direction.boundary)}</p>
          </details>
        </article>
      `;
    }

    /* 统一章节标题，确保导航和正文使用同一组 ID。 */
    function sectionHeading(number, title, description) {
      return `
        <header class="section-heading">

        </header>

    }

    /* ============ v3：模块 + 条目式渲染 ============ */

    /* 建立 ID → 条目内容索引，供关系悬浮查询（观察 / 推断 / 判断 / 方向）。 */
    function buildEntryIndex(data) {
      const index = { observation: {}, inference: {}, judgment: {}, direction: {} };
      Object.entries(data.observationPool || {}).forEach(([oid, text]) => { index.observation[oid] = { type: "观察", text }; });
      Object.entries(data.inferencePool || {}).forEach(([iid, text]) => { index.inference[iid] = { type: "推断", text }; });
      Object.entries(data.judgmentPool || {}).forEach(([jid, text]) => { index.judgment[jid] = { type: "判断", text }; });
      data.facts.forEach((f) => { index.observation[f.id] = { type: "观察", text: f.text }; });
      data.inferences.forEach((i) => { index.inference[i.id] = { type: "推断", text: i.text }; });
      data.judgments.forEach((j) => { index.judgment[j.id] = { type: "判断", text: j.text }; });
      data.directions.forEach((d) => { index.direction[d.id] = { type: "方向", text: `${d.title}：${d.goal}` }; });
      window.__REVIEW_INDEX__ = index;
      return index;
    }

    function moduleHead(number, title, description) {
      return `
        <header class="module-head">
          <span class="section-number">${escapeHtml(number)}</span>
          <div>
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(description)}</p>
          </div>
        </header>
      `;
    }

    /* 按给定类型生成关系链接（用于“基于观察 / 基于推断”等）。 */
    function relIdLinks(typeKey, ids) {
      const typeLabel = { observation: "观察", inference: "推断", judgment: "判断", direction: "方向" };
      return (ids || []).map((id) => `
        <span class="rel-link" data-rel-type="${escapeHtml(typeKey)}" data-rel-id="${escapeHtml(id)}" role="button" tabindex="0">${typeLabel[typeKey] || typeKey} ${escapeHtml(id)}</span>
      `).join("");
    }

    /* 混合 ID 列表（结论依据可能同时含观察、推断、判断）生成关系链接。 */
    function mixedRelLinks(ids) {
      const typeLabel = { observation: "观察", inference: "推断", judgment: "判断", direction: "方向" };
      return (ids || []).map((id) => {
        const index = window.__REVIEW_INDEX__ || {};
        let type = null;
        for (const key of ["observation", "inference", "judgment", "direction"]) {
          if (index[key] && index[key][id]) { type = key; break; }
        }
        if (!type) return "";
        return `<span class="rel-link" data-rel-type="${type}" data-rel-id="${escapeHtml(id)}" role="button" tabindex="0">${typeLabel[type]} ${escapeHtml(id)}</span>`;
      }).join("");
    }

    /* 模块 2：CC 工作流程事实（观察 + 证据 + 支撑关系） */
    function renderFacts(data) {
      return `<div class="entry-list">${data.facts.map((f) => `
        <article class="entry ${f.status === "部分确认" ? "is-partial" : f.status === "待核验" ? "is-pending" : "is-confirmed"}" data-ofdd-id="${escapeHtml(f.id)}">
          <div class="entry-head">
            <span class="entry-id">${escapeHtml(f.id)}</span>
            <span class="status-chip ${f.status === "已确认" ? "status-supported" : f.status === "部分确认" ? "status-pending" : "status-blocked"}">${escapeHtml(f.status)}</span>
          </div>
          <p class="entry-text">${escapeHtml(f.text)}</p>
          <div class="entry-meta">
            <span class="meta-label">证据</span>
            ${f.evidence.map((e) => `<a class="evidence-link" href="${escapeHtml(e.href)}" data-evidence-label="${escapeHtml(e.label)}" data-evidence-quote="${escapeHtml(e.quote)}" data-evidence-meta="${escapeHtml(`${e.id} · ${e.locator} · ${e.integrity}`)}">${escapeHtml(e.label)}</a>`).join("")}
            ${mixedRelLinks(f.relations ? [...(f.relations.inferences || []), ...(f.relations.judgments || []), ...(f.relations.directions || [])] : [])}
          </div>
        </article>`).join("")}</div>`;
    }

    /* 模块 3：关键观察核验 */
    function renderVerification(data) {
      const index = window.__REVIEW_INDEX__ || {};
      return `<div class="entry-list">${data.verification.map((v) => `
        <article class="entry" data-ofdd-id="${escapeHtml(v.id)}">
          <div class="entry-head">
            <span class="entry-id">${escapeHtml(v.id)}</span>
            <span class="status-chip ${v.status === "已确认" ? "status-supported" : v.status === "部分确认" ? "status-pending" : "status-neutral"}">${escapeHtml(v.status)}</span>
          </div>
          <p class="entry-text">${escapeHtml((index.observation[v.id] || {}).text || v.id)}</p>
          <div class="verification-checks">
            ${v.checks.map((c) => `<div class="check-item" data-check-note="${escapeHtml(c.note || "")}" data-check-name="${escapeHtml(c.name)}" role="button" tabindex="0"><span class="check-mark ${c.ok ? "check-ok" : "check-fail"}">${c.ok ? "✓" : "✗"}</span><span>${escapeHtml(c.name)}${c.note ? `<em class="check-hint">· 悬停看依据</em>` : ""}</span></div>`).join("")}
          </div>
        </article>`).join("")}</div>`;
    }

    /* 模块 4：推断 */
    function renderInferences(data) {
      return `<div class="entry-list">${data.inferences.map((i) => `
        <article class="entry" data-ofdd-id="${escapeHtml(i.id)}">
          <div class="entry-head">
            <span class="entry-id">${escapeHtml(i.id)}</span>
            <span class="status-chip ${String(i.status).includes("候选") ? "status-pending" : "status-supported"}">${escapeHtml(i.status)}</span>
          </div>
          <p class="entry-text">${escapeHtml(i.text)}</p>
          <div class="entry-meta"><span class="meta-label">基于观察</span>${relIdLinks("observation", i.observations)}</div>
        </article>`).join("")}</div>`;
    }

    /* 模块 5：判断 */
    function renderJudgments(data) {
      return `<div class="entry-list">${data.judgments.map((j) => `
        <article class="entry" data-ofdd-id="${escapeHtml(j.id)}">
          <div class="entry-head">
            <span class="entry-id">${escapeHtml(j.id)}</span>
            <span class="status-chip ${String(j.status).includes("候选") ? "status-pending" : "status-supported"}">${escapeHtml(j.status)}</span>
          </div>
          <p class="entry-text">${escapeHtml(j.text)}</p>
          <div class="entry-meta">
            <span class="meta-label">评价对象</span><span>${escapeHtml(j.evaluation_object)}</span>
            <span class="meta-label">标准</span><span>${escapeHtml(j.criterion)}</span>
            ${j.inferences && j.inferences.length ? `<span class="meta-label">基于推断</span>${relIdLinks("inference", j.inferences)}` : ""}
          </div>
        </article>`).join("")}</div>`;
    }

    /* 模块 6：方向（候选提效点） */
    function renderDirections(data) {
      return `<div class="entry-list">${data.directions.map((d) => `
        <article class="entry direction-entry" data-ofdd-id="${escapeHtml(d.id)}">
          <div class="entry-head">
            <span class="entry-id">${escapeHtml(d.id)}</span>
            <span class="status-chip status-pending">${escapeHtml(d.status)}</span>
          </div>
          <h3 class="entry-title">${escapeHtml(d.title)}</h3>
          <div class="entry-meta">
            ${d.responds ? `<span class="meta-label">回应</span>${mixedRelLinks([d.responds])}` : ""}
            <span class="meta-label">目标</span><span>${escapeHtml(d.goal)}</span>
          </div>
          <div class="entry-meta">
            <span class="meta-label">依据观察</span>${relIdLinks("observation", d.basis)}
          </div>
          <div class="entry-meta"><span class="meta-label">风险 / 依赖</span><span>${escapeHtml(d.risk)}</span></div>
        </article>`).join("")}</div>`;
    }

    /* 模块 7：疑问 */
    function renderQuestions(data) {
      return `<div class="entry-list">${data.questions.map((q) => `
        <article class="entry question-entry ${q.blocking === "是" ? "is-blocking" : ""}" data-ofdd-id="${escapeHtml(q.id)}">
          <div class="entry-head">
            <span class="entry-id">${escapeHtml(q.id)}</span>
            <span class="status-chip ${q.blocking === "是" ? "status-blocked" : "status-neutral"}">${q.blocking === "是" ? "阻塞" : "不阻塞"}</span>
          </div>
          <p class="entry-text">${escapeHtml(q.text)}</p>
          <div class="entry-meta">
            <span class="meta-label">触发</span>${mixedRelLinks([q.trigger])}
            <span class="meta-label">影响</span><span>${escapeHtml(q.impact)}</span>
          </div>
        </article>`).join("")}</div>`;
    }

    /* 模块 8：未决事项 */
    function renderUnresolved(data) {
      return `<div class="table-shell"><table>
        <thead><tr><th>ID</th><th>未决事项</th><th>影响对象</th><th>负责人</th></tr></thead>
        <tbody>${data.unresolved.map((u) => `<tr><td>${escapeHtml(u.id)}</td><td>${escapeHtml(u.issue)}</td><td>${escapeHtml(u.impact)}</td><td>${escapeHtml(u.owner)}</td></tr>`).join("")}</tbody>
      </table></div>`;
    }

    /* 模块 9：结论汇总 */
    function renderConclusion(data) {
      const c = data.conclusion;
      return `<div class="conclusion-panel">
        <article class="conclusion-main">
          <p class="eyebrow">当前结论</p>
          <h3>${escapeHtml(c.current)}</h3>
          <div class="entry-meta"><span class="meta-label">关键依据</span>${mixedRelLinks(c.basis)}</div>
        </article>
        <aside class="conclusion-side">
          <p class="eyebrow">最大不确定性</p>
          <p>${escapeHtml(c.uncertainty)}</p>
        </aside>
      </div>`;
    }

    /* Review 声明模块内容（数据驱动模块之一）。 */
    function renderDeclaration(data) {
      return `<dl class="declaration-list">
        ${data.declaration.map((d) => `<div class="declaration-row"><dt>${escapeHtml(d.label)}</dt><dd>${escapeHtml(d.value)}</dd></div>`).join("")}
      </dl>`;
    }

    /* v3 主渲染：按数据中的 modules 配置渲染，模块标题 / 顺序 / 内容全部由数据驱动。 */
    function renderReview(data) {
      const app = document.querySelector("#review-app");
      buildEntryIndex(data);
      const lifecycle = data.lifecycle || {};
      const gate = data.executionGate || {};
      const impact = gate.impact || lifecycle.execution_impact || "none";
      const state = lifecycle.session_state || data.meta.sessionState || "running";
      const activationMode = lifecycle.activation_mode || data.meta.activationMode || "initial";
      const modeLabel = activationMode === "inherited_resume" ? "继承式重启" : "首次激活";
      const stateLabel = {
        running: "运行中",
        paused_for_writeback: "暂停待回写",
        resumed_inherited: "已继承续作",
        superseded: "已被后续版本替代",
        closed: "已关闭",
      }[state] || state;
      const impactLabel = {
        none: "不影响执行",
        potential: "继续执行但需监控",
        blocking: "冻结受影响范围",
      }[impact] || impact;
      const affectedScope = (gate.affectedScope || lifecycle.affected_scope || []).join("、") || "无";
      const inheritedText = activationMode === "inherited_resume"
        ? `承接上一轮：${(lifecycle.inherited_artifacts || []).join("、") || "待补"}`
        : "本轮为首次激活，不存在上一轮承接成果";
      const lifecycleClass = impact === "blocking" ? "is-blocking" : impact === "potential" ? "is-potential" : "";
      const lifecycleBanner = `
        <aside class="lifecycle-banner ${lifecycleClass}" aria-label="Review 生命周期与执行闸门">
          <div class="lifecycle-banner-title">${escapeHtml(modeLabel)} · ${escapeHtml(stateLabel)} · ${escapeHtml(impactLabel)}</div>
          <div class="lifecycle-banner-meta">
            <span>Review：${escapeHtml(lifecycle.review_instance_id || data.meta.instanceId || data.meta.id)}</span>
            <span>OFDD：${escapeHtml(lifecycle.source_ofdd_version || data.meta.sourceOfddVersion || "待补")}</span>
            <span>受影响范围：${escapeHtml(affectedScope)}</span>
            <span>${escapeHtml(inheritedText)}</span>
          </div>
        </aside>`;
      const renderers = {
        declaration: () => renderDeclaration(data),
        facts: () => renderFacts(data),
        verification: () => renderVerification(data),
        inferences: () => renderInferences(data),
        judgments: () => renderJudgments(data),
        directions: () => renderDirections(data),
        questions: () => renderQuestions(data),
        unresolved: () => renderUnresolved(data),
        conclusion: () => renderConclusion(data),
      };
      const modules = data.modules || [];
      app.innerHTML = `
        <section class="hero" id="overview">
          <p class="hero-kicker">${escapeHtml(data.meta.type)} · ${escapeHtml(data.meta.date)}</p>
          <h1>${escapeHtml(data.meta.title)}</h1>
          <p class="hero-subtitle">${escapeHtml(data.meta.subtitle)}</p>
          ${lifecycleBanner}
        </section>

        ${modules.map((m) => `
          <section class="module" id="${escapeHtml(m.id)}" data-nav-title="${escapeHtml(m.navTitle)}">
            ${moduleHead(m.number, m.title, m.description)}
            ${(renderers[m.kind] || (() => ""))(m)}
          </section>
        `).join("")}

        <footer class="review-footer">
          <div><strong>OFDD → Review → OFDD</strong>本页面是特定目标下的应用层展示快照，不替代 OFDD 项目实例。</div>
          <div>生成日期：${escapeHtml(data.meta.date)} · ${escapeHtml(data.meta.id)}</div>
        </footer>
      `;
    }

    /* 关系悬浮：观察 ↔ 推断 / 判断 / 方向 双向互查。 */
    function setupRelationTooltips() {
      const tooltip = document.querySelector("#relation-tooltip");
      const index = window.__REVIEW_INDEX__ || {};
      const positionTooltip = (anchor, textTitle, textBody) => {
        tooltip.querySelector("strong").textContent = textTitle;
        tooltip.querySelector("p").textContent = textBody;
        const rect = anchor.getBoundingClientRect();
        const tooltipWidth = tooltip.offsetWidth || 340;
        let left = rect.left;
        if (left + tooltipWidth > window.innerWidth - 12) left = window.innerWidth - tooltipWidth - 12;
        tooltip.style.left = `${Math.max(12, left)}px`;
        tooltip.style.top = `${rect.bottom + 8}px`;
        tooltip.classList.add("is-visible");
      };
      const hideTooltip = () => tooltip.classList.remove("is-visible");

      /* 核验检查项：悬停显示判断依据。 */
      document.querySelectorAll(".check-item[data-check-note]").forEach((item) => {
        const show = () => positionTooltip(item, `核验依据 · ${item.dataset.checkName}`, item.dataset.checkNote);
        item.addEventListener("mouseenter", show);
        item.addEventListener("mouseleave", hideTooltip);
        item.addEventListener("focus", show);
        item.addEventListener("blur", hideTooltip);
      });

      document.querySelectorAll(".rel-link, .based-obs").forEach((link) => {
        const show = () => {
          const type = link.dataset.relType;
          const id = link.dataset.relId;
          const entry = index[type] && index[type][id];
          if (!entry) return;
          positionTooltip(link, `${entry.type} · ${id}`, entry.text);
        };
        link.addEventListener("mouseenter", show);
        link.addEventListener("mouseleave", hideTooltip);
        link.addEventListener("focus", show);
        link.addEventListener("blur", hideTooltip);
      });
    }

    /* 根据章节生成侧边导航，并在滚动时高亮当前章节。 */
    function setupNavigation() {
      const navigation = document.querySelector("#section-navigation");
      const sections = [...document.querySelectorAll("[data-nav-title]")];

      navigation.innerHTML = sections.map((section) => `
        <a href="#${escapeHtml(section.id)}">${escapeHtml(section.dataset.navTitle)}</a>
      `).join("");

      const links = new Map(
        [...navigation.querySelectorAll("a")].map((link) => [link.getAttribute("href").slice(1), link])
      );

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

        if (!visible) return;
        links.forEach((link) => link.classList.remove("is-active"));
        links.get(visible.target.id)?.classList.add("is-active");
      }, { rootMargin: "-20% 0px -65% 0px", threshold: [0, 0.2, 0.6] });

      sections.forEach((section) => observer.observe(section));
    }

    /* 悬停证据时显示原文快照；点击仍跳转完整来源上下文。 */
    function setupEvidenceTooltips() {
      const tooltip = document.querySelector("#evidence-tooltip");
      const label = document.querySelector("#tooltip-label");
      const quote = document.querySelector("#tooltip-quote");
      const meta = document.querySelector("#tooltip-meta");
      const evidenceLinks = document.querySelectorAll(".evidence-link");

      function positionTooltip(event) {
        const margin = 16;
        const tooltipWidth = tooltip.offsetWidth || 350;
        const tooltipHeight = tooltip.offsetHeight || 180;
        let left = event.clientX + 18;
        let top = event.clientY + 18;

        if (left + tooltipWidth > window.innerWidth - margin) {
          left = event.clientX - tooltipWidth - 18;
        }
        if (top + tooltipHeight > window.innerHeight - margin) {
          top = event.clientY - tooltipHeight - 18;
        }

        tooltip.style.left = `${Math.max(margin, left)}px`;
        tooltip.style.top = `${Math.max(margin, top)}px`;
      }

      evidenceLinks.forEach((link) => {
        link.addEventListener("mouseenter", (event) => {
          label.textContent = link.dataset.evidenceLabel;
          quote.textContent = `“${link.dataset.evidenceQuote}”`;
          meta.textContent = link.dataset.evidenceMeta;
          tooltip.classList.add("is-visible");
          tooltip.setAttribute("aria-hidden", "false");
          positionTooltip(event);
        });

        link.addEventListener("mousemove", positionTooltip);
        link.addEventListener("mouseleave", () => {
          tooltip.classList.remove("is-visible");
          tooltip.setAttribute("aria-hidden", "true");
        });
      });
    }

    /* 顶部工具分别控制机器 ID、方向详情和打印。 */
    function setupToolbar() {
      const auditButton = document.querySelector("#audit-toggle");
      const expandButton = document.querySelector("#expand-toggle");
      const printButton = document.querySelector("#print-button");

      auditButton.addEventListener("click", () => {
        const active = document.body.classList.toggle("audit-mode");
        auditButton.setAttribute("aria-pressed", String(active));
        auditButton.textContent = active ? "隐藏 ID" : "显示 ID";
      });

      expandButton.addEventListener("click", () => {
        const details = [...document.querySelectorAll(".direction-detail")];
        const shouldOpen = !details.every((item) => item.open);
        details.forEach((item) => { item.open = shouldOpen; });
        expandButton.setAttribute("aria-pressed", String(shouldOpen));
        expandButton.textContent = shouldOpen ? "折叠方向" : "展开方向";
      });

      printButton.addEventListener("click", () => window.print());
    }

    /* 摘要卡的长文本默认折叠，点击“展开全文”在摘要与全文之间切换。 */
    function bindExpandToggles() {
      document.querySelectorAll(".expand-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.previousElementSibling;
          if (!target || !target.classList.contains("summary-collapse")) return;
          const isOpen = target.classList.toggle("is-open");
          button.setAttribute("aria-expanded", String(isOpen));
          button.textContent = isOpen ? "收起" : "展开全文";
        });
      });
    }

    /* 初始化顺序：先渲染数据，再绑定依赖 DOM 的交互。 */
    renderReview(REVIEW_DATA);
    setupNavigation();
    setupEvidenceTooltips();
    setupRelationTooltips();
    setupToolbar();
    bindExpandToggles();
  </script>
</body>
</html>
